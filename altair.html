<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Altair — Ritual</title>

    <meta name="description" content="A hidden corner of Ritual — a slow, private orbit around Altair." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0a09" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230b0a09%22/><text x=%2250%22 y=%2270%22 font-family=%22Georgia, serif%22 font-size=%2262%22 fill=%22%23d81f2f%22 text-anchor=%22middle%22>R</text></svg>" />

    <!-- Performance: warm up connections before we need them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #0b0a09;
            --paper: #efe8d9;
            --paper-dim: #c9c0ac;
            --ink: #8c8478;
            --ink-dim: #5c564c;
            --red: #d81f2f;
            --red-bright: #ff3346;
            --red-glow: rgba(216, 31, 47, 0.30);
            --red-glow-strong: rgba(255, 51, 70, 0.55);
            --line: #2a2521;
            --line-bright: #3c352d;
            --mono: 'IBM Plex Mono', monospace;
            --display: 'Bebas Neue', 'IBM Plex Mono', sans-serif;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            touch-action: none;
            cursor: grab;
        }
        canvas.grabbing {
            cursor: grabbing;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.78) 100%);
        }

        #overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            font-family: var(--mono);
            color: var(--paper);
        }

        .corner-tag {
            position: absolute;
            top: 2.2rem;
            font-size: .58rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--ink);
            border-bottom: 1px solid var(--line-bright);
            padding-bottom: .5rem;
            pointer-events: auto;
        }
        .corner-tag-left {
            left: 2rem;
        }
        .corner-tag-right {
            right: 2rem;
            color: var(--red-bright);
            border-color: var(--red-deep, var(--line-bright));
        }
        a.corner-tag {
            text-decoration: none;
            transition: color .25s, border-color .25s;
        }
        a.corner-tag:hover {
            color: var(--red-bright);
            border-color: var(--red-bright);
        }

        #title {
            position: absolute;
            top: 7vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        #title h1 {
            margin: 0;
            position: relative;
            display: inline-block;
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(2.6rem, 9vw, 5.5rem);
            letter-spacing: .03em;
            text-transform: uppercase;
            color: var(--paper);
            text-shadow: 0 0 30px var(--red-glow-strong), 0 0 70px var(--red-glow);
        }
        #title h1::after {
            content: attr(data-text);
            position: absolute;
            left: 4px;
            top: 4px;
            z-index: -1;
            color: var(--red-bright);
            opacity: .55;
        }
        #title p {
            margin: 1rem 0 0;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            color: var(--ink);
        }
        #title .caveat {
            margin-top: 0.5rem;
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            color: var(--ink-dim);
            font-style: italic;
        }

        #readout {
            position: absolute;
            left: 4vw;
            bottom: 4vh;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--ink);
            line-height: 1.9;
        }
        #readout .label {
            color: var(--ink-dim);
            margin-right: 0.8em;
        }
        #readout #rot-val {
            color: var(--red-bright);
        }

        #hints {
            position: absolute;
            right: 4vw;
            bottom: 4vh;
            text-align: right;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            color: var(--ink);
            line-height: 1.9;
        }
        #hints .bracket {
            color: var(--line-bright);
        }

        .reticle {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--line-bright);
            opacity: 0.75;
        }
        #ret-tl {
            top: 22px;
            left: 22px;
            border-top: 1px solid;
            border-left: 1px solid;
        }
        #ret-tr {
            top: 22px;
            right: 22px;
            border-top: 1px solid;
            border-right: 1px solid;
        }
        #ret-bl {
            bottom: 22px;
            left: 22px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }
        #ret-br {
            bottom: 22px;
            right: 22px;
            border-bottom: 1px solid;
            border-right: 1px solid;
        }

        #cross {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            transform: translate(-50%, -50%);
            opacity: 0.3;
        }
        #cross::before,
        #cross::after {
            content: "";
            position: absolute;
            background: var(--red-bright);
        }
        #cross::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            transform: translateY(-50%);
        }
        #cross::after {
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            transform: translateX(-50%);
        }

        @media (max-width: 860px) {
            .corner-tag {
                font-size: .5rem;
                top: 1.2rem;
            }
            .corner-tag-left {
                left: 1.2rem;
            }
            .corner-tag-right {
                right: 1.2rem;
            }
            #title p {
                font-size: .62rem;
            }
        }
    </style>
</head>
<body>

    <div class="vignette"></div>

    <div id="overlay">
        <a class="corner-tag corner-tag-left" href="index.html">← back to ritual</a>
        <div class="corner-tag corner-tag-right">file n.???</div>

        <div id="title">
            <h1 data-text="Altair">Altair</h1>
            <p>&alpha; Aquilae &middot; 16.7 ly &middot; A7&nbsp;V &middot; ~7,700&nbsp;K</p>
        </div>

        <div id="readout">
            <div><span class="label">ROT</span><span id="rot-val">0.0&deg;</span></div>
            <div><span class="label">OBL</span><span>0.87</span></div>
        </div>

        <div id="hints">
            <div><span class="bracket">[</span>drag<span class="bracket">]</span>&nbsp;orbit</div>
            <div><span class="bracket">[</span>scroll<span class="bracket">]</span>&nbsp;zoom</div>
        </div>

        <div class="reticle" id="ret-tl"></div>
        <div class="reticle" id="ret-tr"></div>
        <div class="reticle" id="ret-bl"></div>
        <div class="reticle" id="ret-br"></div>
        <div id="cross"></div>
    </div>

    <!-- Three.js from CDN (loaded synchronously so the inline script can use it) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- All easteregg.js logic inlined -->
    <script>
        /*
         * easteregg.js — the star scene behind the hidden Altair page.
         * Same orbit-drag / scroll-zoom mechanics as the original piece; the
         * lighting, textures, and sprite tint are recolored so the whole scene
         * reads as warm gold / paper / red instead of icy blue-white, matching
         * the rest of Ritual (which never uses blue anywhere).
         */
        (function() {
            "use strict";

            var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            var STAR_RADIUS = 5;
            var OBLATENESS = 0.87;
            var SPIN_SPEED = reducedMotion ? 0.05 : 0.35; // rad/sec, artistic (not real-time) scale

            var scene, camera, renderer, clock;
            var starMesh, glowSprite, haloSprite, fieldGroup;
            var rotEl = document.getElementById('rot-val');

            // --- camera orbit state (manual, no addons needed) ---
            var radius = 20,
                minRadius = 9,
                maxRadius = 46;
            var theta = Math.PI / 2.4;
            var phi = Math.PI / 2.3;
            var targetTheta = theta,
                targetPhi = phi;
            var isDragging = false,
                prevX = 0,
                prevY = 0;
            var autoDrift = !reducedMotion;
            var resumeTimer = null;

            init();
            animate();

            function init() {
                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                clock = new THREE.Clock();

                // Warm ember ambient instead of the original cool blue — keeps the
                // shadowed side of the star reading red/brown rather than icy.
                scene.add(new THREE.AmbientLight(0x2a1210, 0.9));
                var light = new THREE.PointLight(0xfff4e0, 1.1);
                light.position.set(0, 0, 0);
                scene.add(light);

                fieldGroup = new THREE.Group();
                scene.add(fieldGroup);
                fieldGroup.add(makeStarfield(1800, 300, 0.7));
                fieldGroup.add(makeStarfield(600, 170, 1.3));

                var geo = new THREE.SphereGeometry(STAR_RADIUS, 80, 60);
                var tex = generateStarTexture();
                var mat = new THREE.MeshStandardMaterial({
                    map: tex,
                    emissive: new THREE.Color(0xfff6d8),
                    emissiveMap: tex,
                    emissiveIntensity: 1.35,
                    roughness: 0.65,
                    metalness: 0.0
                });
                starMesh = new THREE.Mesh(geo, mat);
                starMesh.scale.set(1, OBLATENESS, 1); // fast rotators bulge at the equator
                scene.add(starMesh);

                // Wide, faint red halo behind everything — Ritual's signature glow
                // treatment (the same soft red bloom used on the nav mark, the status
                // dot, the hero title) applied to the one thing on this page worth it.
                var haloTex = generateHaloTexture();
                var haloMat = new THREE.SpriteMaterial({
                    map: haloTex,
                    color: 0xffffff,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                haloSprite = new THREE.Sprite(haloMat);
                haloSprite.scale.set(30, 30, 1);
                scene.add(haloSprite);

                var glowTex = generateGlowTexture();
                var glowMat = new THREE.SpriteMaterial({
                    map: glowTex,
                    color: 0xfff2df, // warm near-white instead of pure white
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                glowSprite = new THREE.Sprite(glowMat);
                glowSprite.scale.set(17, 17, 1);
                scene.add(glowSprite);

                updateCameraPosition();
                window.addEventListener('resize', onResize);
                addPointerControls();
            }

            function makeStarfield(count, spread, size) {
                var positions = new Float32Array(count * 3);
                for (var i = 0; i < count; i++) {
                    var r = spread * (0.6 + Math.random() * 0.4);
                    var t = Math.random() * Math.PI * 2;
                    var p = Math.acos(2 * Math.random() - 1);
                    positions[i * 3] = r * Math.sin(p) * Math.cos(t);
                    positions[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
                    positions[i * 3 + 2] = r * Math.cos(p);
                }
                var geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                var mat = new THREE.PointsMaterial({
                    color: 0xf5e9dd, // warm pale instead of pure white
                    size: size,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.8
                });
                return new THREE.Points(geo, mat);
            }

            // Latitude-banded texture: was icy-blue poles fading to gold at the
            // equator (a nod to real gravity-darkening); poles are now Ritual's
            // paper tone instead of blue, so nothing on the sphere reads cold.
            function generateStarTexture() {
                var w = 1024,
                    h = 512;
                var canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                var ctx = canvas.getContext('2d');

                var grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0.00, '#efe8d9');
                grad.addColorStop(0.14, '#fdf7e6');
                grad.addColorStop(0.50, '#fff0bf');
                grad.addColorStop(0.86, '#fdf7e6');
                grad.addColorStop(1.00, '#efe8d9');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                for (var i = 0; i < 5000; i++) {
                    var x = Math.random() * w;
                    var y = Math.random() * h;
                    var rr = Math.random() * 2.2 + 0.4;
                    var a = Math.random() * 0.12;
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
                    ctx.arc(x, y, rr, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (var j = 0; j < 160; j++) {
                    var sy = Math.random() * h;
                    var sx = Math.random() * w;
                    var len = 20 + Math.random() * 80;
                    var sa = Math.random() * 0.08;
                    ctx.strokeStyle = 'rgba(255,240,210,' + sa + ')';
                    ctx.lineWidth = 1 + Math.random() * 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + len, sy + (Math.random() - 0.5) * 6);
                    ctx.stroke();
                }

                var texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                return texture;
            }

            function generateGlowTexture() {
                var size = 256;
                var canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                var ctx = canvas.getContext('2d');
                var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.18, 'rgba(255,248,225,0.85)');
                grad.addColorStop(0.45, 'rgba(255,220,150,0.28)');
                grad.addColorStop(1, 'rgba(255,200,100,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
                return new THREE.CanvasTexture(canvas);
            }

            // Soft red bloom, wider and fainter than the glow sprite, sitting behind
            // it — Ritual's --red-glow-strong translated into the 3D scene.
            function generateHaloTexture() {
                var size = 256;
                var canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                var ctx = canvas.getContext('2d');
                var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                grad.addColorStop(0, 'rgba(216,31,47,0.32)');
                grad.addColorStop(0.35, 'rgba(216,31,47,0.14)');
                grad.addColorStop(1, 'rgba(216,31,47,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
                return new THREE.CanvasTexture(canvas);
            }

            function updateCameraPosition() {
                camera.position.x = radius * Math.sin(phi) * Math.cos(theta);
                camera.position.y = radius * Math.cos(phi);
                camera.position.z = radius * Math.sin(phi) * Math.sin(theta);
                camera.lookAt(0, 0, 0);
            }

            function addPointerControls() {
                var dom = renderer.domElement;

                function down(x, y) {
                    isDragging = true;
                    prevX = x;
                    prevY = y;
                    autoDrift = false;
                    clearTimeout(resumeTimer);
                    dom.classList.add('grabbing');
                }

                function move(x, y) {
                    if (!isDragging) return;
                    var dx = x - prevX,
                        dy = y - prevY;
                    targetTheta -= dx * 0.005;
                    targetPhi -= dy * 0.005;
                    targetPhi = Math.max(0.4, Math.min(Math.PI - 0.4, targetPhi));
                    prevX = x;
                    prevY = y;
                }

                function up() {
                    isDragging = false;
                    dom.classList.remove('grabbing');
                    if (!reducedMotion) {
                        resumeTimer = setTimeout(function() { autoDrift = true; }, 2500);
                    }
                }

                dom.addEventListener('mousedown', function(e) { e.preventDefault();
                    down(e.clientX, e.clientY); });
                window.addEventListener('mousemove', function(e) { move(e.clientX, e.clientY); });
                window.addEventListener('mouseup', up);

                dom.addEventListener('touchstart', function(e) { var t = e.touches[0];
                    down(t.clientX, t.clientY); }, { passive: true });
                dom.addEventListener('touchmove', function(e) { var t = e.touches[0];
                    move(t.clientX, t.clientY); }, { passive: true });
                dom.addEventListener('touchend', up);

                dom.addEventListener('wheel', function(e) {
                    radius += e.deltaY * 0.01;
                    radius = Math.max(minRadius, Math.min(maxRadius, radius));
                }, { passive: true });
            }

            function onResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            var frame = 0;

            function animate() {
                requestAnimationFrame(animate);
                var dt = Math.min(clock.getDelta(), 0.05);
                var elapsed = clock.elapsedTime;

                starMesh.rotation.y += dt * SPIN_SPEED;

                var pulse = 1 + Math.sin(elapsed * 1.2) * 0.04;
                glowSprite.scale.set(17 * pulse, 17 * pulse, 1);

                var haloPulse = 1 + Math.sin(elapsed * 0.8) * 0.06;
                haloSprite.scale.set(30 * haloPulse, 30 * haloPulse, 1);

                if (!reducedMotion) {
                    fieldGroup.rotation.y += dt * 0.004;
                    if (autoDrift) targetTheta += dt * 0.03;
                }

                theta += (targetTheta - theta) * 0.06;
                phi += (targetPhi - phi) * 0.06;
                updateCameraPosition();

                frame++;
                if (frame % 3 === 0) {
                    var deg = THREE.MathUtils ? THREE.MathUtils.radToDeg(starMesh.rotation.y) : starMesh.rotation.y * 180 /
                        Math.PI;
                    deg = ((deg % 360) + 360) % 360;
                    rotEl.textContent = deg.toFixed(1) + '\u00B0';
                }

                renderer.render(scene, camera);
            }
        })();
    </script>

</body>
</html>
