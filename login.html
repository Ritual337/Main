<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access — Ritual</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a0908" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230a0908%22/><text x=%2250%22 y=%2270%22 font-family=%22Georgia, serif%22 font-size=%2262%22 fill=%22%23d81f2f%22 text-anchor=%22middle%22>R</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --bg:#0a0908; --bg2:#121110; --bg3:#17140f; --paper:#f1ead9; --paper-dim:#cbc2ad;
    --ink:#8d8578; --ink-dim:#5c564c;
    --red:#d81f2f; --red-bright:#ff3346; --red-deep:#6e0f17;
    --red-glow:rgba(216,31,47,.28); --red-glow-strong:rgba(255,51,70,0.5);
    --line:#241f1a; --line-bright:#3a3229;
    --mono:'IBM Plex Mono',monospace; --serif:'Source Serif 4',Georgia,serif; --display:'Bebas Neue','IBM Plex Mono',sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --dur-fast: 160ms; --dur-base: 260ms;
    --nav-h:4.5rem;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--paper-dim); font-family:var(--serif); min-height:100vh;
    display:flex; flex-direction:column; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--red-bright); outline-offset:3px; border-radius:1px; }

  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%); }

  /* ===== nav ===== */
  .nav-bar { position: relative; z-index: 2; border-bottom: 1px solid var(--line); background: rgba(10,9,8,0.9); backdrop-filter: blur(14px); }
  .nav-inner { max-width: 1100px; margin: 0 auto; padding: 1.1rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .nav-logo { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
  .nav-logo-mark {
    width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center;
    background: var(--red); color: var(--bg); font-family: var(--display); font-size: 1rem; border-radius: 3px;
    box-shadow: 0 0 14px var(--red-glow-strong); transition: transform var(--dur-base) var(--ease-out);
  }
  .nav-logo:hover .nav-logo-mark { transform: rotate(-8deg) scale(1.08); }
  .nav-logo-text { font-family: var(--display); font-size: 1.05rem; letter-spacing: .1em; color: var(--paper); text-transform: uppercase; }
  .nav-logo-text em { color: var(--red-bright); font-style: normal; }
  .nav-crumb { font-family: var(--mono); font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
  .nav-crumb span { color: var(--red-bright); }
  .nav-actions { display: flex; align-items: center; gap: 1rem; }
  .btn-back {
    font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: none; border: 1px solid var(--line-bright); padding: .45rem .75rem; cursor: pointer; border-radius: 2px;
    text-decoration: none; transition: border-color var(--dur-base), color var(--dur-base);
  }
  .btn-back:hover { border-color: var(--red-bright); color: var(--red-bright); }

  /* ===== login card ===== */
  .login-wrapper { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; position: relative; z-index: 1; }
  .gate-card{
    width:100%; max-width:400px; background:var(--bg2); border:1px solid var(--line); border-top:2px solid var(--red);
    padding:2.6rem 2.3rem; position:relative; overflow:hidden; opacity: 0;
  }
  .gate-card::before, .gate-card::after {
    content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid var(--red-bright); opacity: .7; pointer-events: none;
  }
  .gate-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .gate-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .gate-scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(216,31,47,.02) 3px, rgba(216,31,47,.02) 6px);
  }
  .gate-card > * { position:relative; z-index:1; }
  .gate-icon{
    width:42px; height:42px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line-bright); border-radius:50%; color:var(--red-bright);
    font-size:1rem; margin-bottom:1.2rem;
  }
  .gate-label{
    font-family:var(--mono); font-size:.55rem; letter-spacing:.25em; text-transform:uppercase;
    color:var(--red-bright); margin-bottom:.5rem;
  }
  .gate-title{
    font-family:var(--display); font-size:2.2rem; letter-spacing:.02em; text-transform:uppercase;
    color:var(--paper); line-height:1; margin-bottom:.6rem;
  }
  .gate-title em{ color:var(--red-bright); font-style:normal; }
  .gate-sub{
    font-family:var(--mono); font-size:.62rem; color:var(--ink); letter-spacing:.04em; line-height:1.6; margin-bottom:1.8rem;
  }
  .gate-form{ display:flex; flex-direction:column; gap:1rem; }
  .gate-field-label{
    font-family:var(--mono); font-size:.5rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink);
  }
  .pass-row{ display:flex; border:1px solid var(--line); border-bottom:1px solid var(--line-bright); transition: border-color var(--dur-base), box-shadow var(--dur-base); }
  .pass-row:focus-within{ border-color:var(--red-bright); box-shadow: 0 0 0 3px var(--red-glow); }
  .pass-row input{
    flex:1; background:var(--bg); border:none; color:var(--paper); font-family:var(--mono);
    font-size:.9rem; padding:.7rem .8rem; outline:none; letter-spacing:.05em;
  }
  .pass-toggle{
    background:var(--bg); border:none; border-left:1px solid var(--line); color:var(--ink);
    width:2.6rem; cursor:pointer; transition:color var(--dur-base);
  }
  .pass-toggle:hover{ color:var(--red-bright); }
  .gate-error{
    font-family:var(--mono); font-size:.55rem; color:var(--red-bright); letter-spacing:.04em; line-height:1.6; min-height:1em;
  }
  .gate-submit{
    background:none; border:1px solid var(--red-bright); color:var(--red-bright); font-family:var(--mono);
    font-size:.58rem; letter-spacing:.2em; text-transform:uppercase; padding:.8rem 1rem; cursor:pointer; transition:all var(--dur-base);
  }
  .gate-submit:hover{ background:var(--red-bright); color:var(--bg); box-shadow:0 0 28px var(--red-glow-strong); }
  .gate-submit:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; background:none; color:var(--red-bright); }
  .gate-note{
    display:flex; gap:.55rem; align-items:flex-start; font-family:var(--mono); font-size:.5rem;
    color:var(--ink-dim); letter-spacing:.02em; line-height:1.7; margin-top:1.8rem; padding-top:1.4rem;
    border-top:1px solid var(--line);
  }
  .gate-note i{ color:var(--red-bright); margin-top:.15rem; flex:none; }

  @media (prefers-reduced-motion: reduce) { .gate-card { opacity: 1 !important; } }
</style>
</head>
<body>
<div class="vignette"></div>

<nav class="nav-bar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-mark">R</span>
      <span class="nav-logo-text">Ritu<em>al</em></span>
    </a>
    <div class="nav-actions">
      <span class="nav-crumb">Restricted <span>/</span> Gallery Dashboard</span>
      <a href="index.html" class="btn-back">← Back</a>
    </div>
  </div>
</nav>

<div class="login-wrapper">
  <div class="gate-card" id="gate-card">
    <div class="gate-scanlines"></div>
    <div class="gate-icon"><i class="fas fa-lock"></i></div>
    <div class="gate-label">Restricted access</div>
    <h1 class="gate-title">Ritu<em>al</em></h1>
    <p class="gate-sub">This archive is private.<br />Enter the password to continue.</p>
    <form id="login-form" class="gate-form" autocomplete="off">
      <div>
        <label class="gate-field-label" for="password">Password</label>
        <div class="pass-row" style="margin-top:.4rem;">
          <input type="password" id="password" name="password" required autocomplete="current-password" />
          <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="gate-error" id="login-error" role="alert"></div>
      <button type="submit" class="gate-submit" id="login-submit"><span>Enter</span></button>
    </form>
    <p class="gate-note"><i class="fas fa-triangle-exclamation"></i> <span>If you do not know the password, this page is not meant for you.</span></p>
  </div>
</div>

<script src="js/gallery-auth.js" defer></script>
<script>
  // Simple password toggle
  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('pass-toggle');
    const input = document.getElementById('password');
    toggle.addEventListener('click', () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      toggle.innerHTML = showing ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });
  });

  // GSAP entrance for the gate card — icon pops, then the form settles in.
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const card = document.getElementById('gate-card');
    if (!card) return;
    if (reduced || !window.gsap) { card.style.opacity = 1; return; }
    gsap.timeline({ defaults: { ease: 'power4.out' } })
      .fromTo(card, { opacity: 0, y: 26, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.9 })
      .fromTo('.gate-icon', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(2.4)' }, '-=0.55')
      .fromTo(['.gate-label', '.gate-title', '.gate-sub'], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.08 }, '-=0.4')
      .fromTo('.gate-form > div, .gate-error, .gate-submit', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08 }, '-=0.3')
      .fromTo('.gate-note', { opacity: 0 }, { opacity: 1, duration: 0.5 }, '-=0.2');
  })();
</script>
</body>
</html>
