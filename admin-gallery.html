<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery Admin — R3ign</title>
<meta name="description" content="Admin — gallery management for R3ign." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a0908" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --bg:#0a0908; --bg2:#121110; --bg3:#17140f; --paper:#f1ead9; --paper-dim:#cbc2ad; --ink:#8d8578; --ink-dim:#5c564c;
    --red:#d81f2f; --red-bright:#ff3346; --red-deep:#6e0f17; --red-glow:rgba(216,31,47,.28); --red-glow-strong:rgba(255,51,70,.5);
    --line:#241f1a; --line-bright:#3a3229;
    --mono:'IBM Plex Mono',monospace; --serif:'Source Serif 4',Georgia,serif; --display:'Bebas Neue','IBM Plex Mono',sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --dur-fast: 160ms; --dur-base: 260ms;
    --nav-h:4.5rem;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{ background:var(--bg); color:var(--paper-dim); font-family:var(--serif); min-height:100vh; -webkit-font-smoothing: antialiased; }
  img{ max-width:100%; display:block; }
  button { font: inherit; }
  :focus-visible{ outline:2px solid var(--red-bright); outline-offset:3px; border-radius:1px; }

  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%); }

  /* ===== unified nav (matches admin-guestbook) ===== */
  .nav-bar { position: relative; z-index: 2; border-bottom: 1px solid var(--line); background: rgba(10,9,8,0.9); backdrop-filter: blur(14px); }
  .nav-inner { max-width: 1100px; margin: 0 auto; padding: 1.1rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .nav-logo { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
  .nav-logo-mark { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--red); color: var(--bg); font-family: var(--display); font-size: 1rem; border-radius: 3px; box-shadow: 0 0 14px var(--red-glow-strong); transition: transform var(--dur-base) var(--ease-out); }
  .nav-logo:hover .nav-logo-mark { transform: rotate(-8deg) scale(1.08); }
  .nav-logo-text { font-family: var(--display); font-size: 1.05rem; letter-spacing: .1em; color: var(--paper); text-transform: uppercase; }
  .nav-logo-text em { color: var(--red-bright); font-style: normal; }
  .nav-crumb { font-family: var(--mono); font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
  .nav-crumb span { color: var(--red-bright); }
  .nav-actions { display: flex; align-items: center; gap: 1rem; }
  .btn-logout {
    font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: none; border: 1px solid var(--line-bright); padding: .45rem .75rem; cursor: pointer; border-radius: 2px;
    transition: border-color var(--dur-base), color var(--dur-base);
  }
  .btn-logout:hover { border-color: var(--red-bright); color: var(--red-bright); }

  /* ===== page shell ===== */
  .section{ position: relative; z-index: 1; padding:4rem 2rem 6rem; max-width:1100px; margin:0 auto; }
  .eyebrow{ display:flex; align-items:center; gap:1rem; margin-bottom:1.4rem; flex-wrap:wrap; opacity: 0; }
  .eyebrow-num{ font-family:var(--mono); font-size:.62rem; letter-spacing:.18em; color:var(--bg); background:var(--red); padding:.25rem .5rem; border-radius:2px; }
  .eyebrow-text{ font-family:var(--mono); font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; color:var(--paper); }
  .eyebrow-line{ flex:1; height:1px; background:var(--line-bright); }
  .eyebrow-meta{ font-family:var(--mono); font-size:.52rem; color:var(--ink-dim); letter-spacing:.04em; }
  .section-title{ font-family:var(--display); font-size:clamp(2.2rem,5.5vw,3.6rem); letter-spacing:.02em; color:var(--paper); text-transform:uppercase; line-height:.9; opacity: 0; }
  .section-note{ font-family:var(--mono); font-size:.66rem; color:var(--ink); letter-spacing:.03em; margin:1rem 0 2.6rem; max-width:56ch; line-height:1.8; opacity: 0; }

  /* upload area with drag-drop */
  .upload-area{
    border:2px dashed var(--line-bright); background:var(--bg2); padding:2.8rem 2rem; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:1.1rem; transition:border-color var(--dur-base), background var(--dur-base);
    cursor:pointer; border-radius: 3px; opacity: 0;
  }
  .upload-area.dragover{ border-color:var(--red-bright); background:var(--bg3); }
  .upload-area:hover{ border-color:var(--red); background:var(--bg3); }
  .upload-label{
    display:inline-flex; align-items:center; gap:.6rem; cursor:pointer; font-family:var(--mono);
    font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--red-bright);
  }
  .upload-icon{
    width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:1px solid var(--red-bright);
    border-radius:50%; font-size:1rem; line-height:1; transition: transform var(--dur-base) var(--ease-out);
  }
  .upload-area:hover .upload-icon { transform: scale(1.1) rotate(90deg); }
  .upload-preview{
    max-width:200px; max-height:150px; object-fit:contain; border:1px solid var(--line-bright);
    display:none; margin:.2rem 0; border-radius: 2px;
  }
  .upload-preview.show{ display:block; }

  #caption-input{
    width:100%; max-width:420px; background:var(--bg); border:1px solid var(--line-bright); color:var(--paper);
    font-family:var(--mono); font-size:.75rem; letter-spacing:.03em; padding:.7rem .85rem; transition:border-color var(--dur-base); border-radius: 2px;
  }
  #caption-input:focus{ outline:none; border-color:var(--red-bright); }
  #caption-input::placeholder{ color:var(--ink-dim); }

  .upload-row{ display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; justify-content:center; }
  #upload-btn{
    background:var(--red); border:none; color:var(--bg); font-family:var(--mono); font-size:.66rem;
    letter-spacing:.16em; text-transform:uppercase; padding:.8rem 2.3rem; cursor:pointer; transition:background var(--dur-base); border-radius: 2px;
  }
  #upload-btn:hover{ background:var(--red-bright); }
  #upload-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .progress-wrap{ width:100%; max-width:420px; height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin:.2rem 0; display:none; }
  .progress-wrap.show{ display:block; }
  .progress-bar{ height:100%; width:0%; background:var(--red-bright); transition:width .15s; border-radius:2px; }

  #upload-status{ font-family:var(--mono); font-size:.6rem; letter-spacing:.05em; color:var(--ink); min-height:1.2em; }

  .settings-card{ background:var(--bg2); border:1px solid var(--line); padding:1.6rem; opacity: 0; }
  .settings-card p{ font-family:var(--mono); font-size:.6rem; color:var(--ink); margin-bottom:.8rem; }
  .settings-row{ display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
  .settings-row label{ font-family:var(--mono); font-size:.55rem; letter-spacing:.1em; color:var(--ink); text-transform:uppercase; }
  .settings-row select{
    background:var(--bg); border:1px solid var(--line-bright); color:var(--paper);
    font-family:var(--mono); font-size:.75rem; padding:.45rem .8rem; border-radius: 2px; transition: border-color var(--dur-base);
  }
  .settings-row select:focus{ outline:none; border-color:var(--red-bright); }
  .settings-btn{
    background:var(--red); border:none; color:var(--bg); font-family:var(--mono);
    font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; padding:.45rem 1.3rem; cursor:pointer;
    transition:background var(--dur-base); border-radius: 2px;
  }
  .settings-btn:hover{ background:var(--red-bright); }
  .settings-status{ font-family:var(--mono); font-size:.55rem; color:var(--ink-dim); min-width:4rem; }

  .admin-actions{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; opacity: 0; }
  .admin-btn{
    background:var(--bg2); border:1px solid var(--line-bright); color:var(--ink); font-family:var(--mono);
    font-size:.55rem; letter-spacing:.08em; padding:.45rem .85rem; cursor:pointer; text-transform:uppercase;
    transition:border-color var(--dur-base),color var(--dur-base); border-radius: 2px;
  }
  .admin-btn:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .admin-btn.danger{ border-color:var(--red-deep); color:var(--red-bright); }
  .admin-btn.danger:hover{ background:var(--red-deep); color:var(--paper); }
  .admin-btn:disabled { opacity: .4; cursor: not-allowed; }

  .image-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1px; background:var(--line); margin-top:2rem; border: 1px solid var(--line); }
  .image-item{
    background:var(--bg2); padding:.7rem; display:flex; flex-direction:column; gap:.4rem; position:relative; transition: background var(--dur-base);
    opacity: 0; transform: translateY(14px) scale(.97); animation: itemIn .5s var(--ease-out) forwards;
  }
  @keyframes itemIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .image-item { animation: none !important; opacity: 1 !important; transform: none !important; } }
  .image-item:nth-child(1){animation-delay:0ms}.image-item:nth-child(2){animation-delay:35ms}.image-item:nth-child(3){animation-delay:70ms}
  .image-item:nth-child(4){animation-delay:105ms}.image-item:nth-child(5){animation-delay:140ms}.image-item:nth-child(6){animation-delay:175ms}
  .image-item:nth-child(7){animation-delay:210ms}.image-item:nth-child(8){animation-delay:245ms}.image-item:nth-child(n+9){animation-delay:280ms}
  .image-item:hover { background: var(--bg3); }
  .image-item .checkbox-wrap{ position:absolute; top:.5rem; right:.5rem; z-index:2; }
  .image-item input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--red-bright); cursor:pointer; }
  .image-item img{ width:100%; height:180px; object-fit:cover; filter:grayscale(60%) brightness(.75); transition:filter .48s ease; border-radius: 1px; }
  .image-item:hover img{ filter:grayscale(10%) brightness(.95); }
  .image-item .caption{ font-family:var(--mono); font-size:.62rem; color:var(--ink); letter-spacing:.03em; line-height:1.5; }
  .image-item .meta{ font-family:var(--mono); font-size:.48rem; color:var(--ink-dim); letter-spacing:.02em; }
  .image-item .delete-btn{
    background:var(--red-deep); border:none; color:var(--paper); font-family:var(--mono); font-size:.58rem;
    letter-spacing:.1em; text-transform:uppercase; padding:.5rem .8rem; cursor:pointer; transition:background var(--dur-base); border-radius: 2px;
  }
  .image-item .delete-btn:hover{ background:var(--red-bright); color:var(--bg); }
</style>
</head>
<body>
<div class="vignette"></div>

<nav class="nav-bar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-mark">R</span>
      <span class="nav-logo-text">Ritu<em>al</em></span>
    </a>
    <div class="nav-actions">
      <span class="nav-crumb">Admin <span>/</span> Gallery</span>
      <button class="btn-logout" data-logout type="button">Logout</button>
    </div>
  </div>
</nav>

<main class="section">
  <div class="eyebrow">
    <span class="eyebrow-num">08</span>
    <span class="eyebrow-text">Admin</span>
    <span class="eyebrow-line"></span>
    <span class="eyebrow-meta" id="admin-meta"></span>
  </div>
  <h1 class="section-title">Upload Frames</h1>
  <p class="section-note">Add new photographs to the gallery, or remove ones already published.</p>

  <div class="upload-area" id="upload-area">
    <label for="file-input" class="upload-label"><span class="upload-icon">+</span>Drop image here or click to browse</label>
    <input type="file" id="file-input" accept="image/*" hidden />
    <img class="upload-preview" id="upload-preview" alt="Preview" />
    <input type="text" id="caption-input" placeholder="Optional caption" />
    <div class="upload-row">
      <button id="upload-btn" type="button">Upload</button>
    </div>
    <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <p id="upload-status"></p>
  </div>

  <div class="eyebrow" style="margin-top:2.5rem;">
    <span class="eyebrow-num">09</span>
    <span class="eyebrow-text">Published</span>
    <span class="eyebrow-line"></span>
    <span class="eyebrow-meta" id="published-count"></span>
  </div>
  <div class="admin-actions" style="margin-bottom:1rem;">
    <button class="admin-btn" id="refresh-btn">⟳ Refresh</button>
    <button class="admin-btn danger" id="batch-delete-btn" disabled>Delete Selected</button>
    <span style="font-family:var(--mono);font-size:.5rem;color:var(--ink-dim);" id="selection-info">0 selected</span>
  </div>

  <div class="image-grid" id="image-grid"></div>

  <div class="settings-area">
    <div class="eyebrow" style="margin-top:3rem; margin-bottom:1rem;">
      <span class="eyebrow-num">10</span>
      <span class="eyebrow-text">Display Settings</span>
      <span class="eyebrow-line"></span>
    </div>
    <div class="settings-card">
      <p>Choose how images appear on the public gallery page.</p>
      <div class="settings-row">
        <label for="layout-select">Layout Mode</label>
        <select id="layout-select">
          <option value="grid">Uniform Grid (fill cells)</option>
          <option value="masonry">Natural Masonry (original sizes)</option>
          <option value="fixed">Fixed Height (uniform crop)</option>
        </select>
        <button class="settings-btn" id="save-layout-btn">Save</button>
        <span class="settings-status" id="layout-status"></span>
      </div>
    </div>
  </div>
</main>

<script>
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || !window.gsap) {
      document.querySelectorAll('.eyebrow, .section-title, .section-note, .upload-area, .admin-actions, .settings-card')
        .forEach((el) => { el.style.opacity = 1; });
      return;
    }
    gsap.timeline({ defaults: { ease: 'power4.out' } })
      .to('.section > .eyebrow', { opacity: 1, duration: 0.8 }, 0.1)
      .to('.section-title', { opacity: 1, duration: 0.9 }, '-=0.5')
      .to('.section-note', { opacity: 1, duration: 0.8 }, '-=0.6')
      .to('#upload-area', { opacity: 1, duration: 0.9 }, '-=0.5')
      .to('.admin-actions', { opacity: 1, duration: 0.7 }, '-=0.5')
      .to('.settings-card', { opacity: 1, duration: 0.8 }, '-=0.4');
  })();
</script>
<script src="js/toast.js"></script>
<script src="js/gallery-auth.js"></script>
<script src="js/admin-gallery.js"></script>
<script src="js/protection.js" defer></script>
</body>
</html>
