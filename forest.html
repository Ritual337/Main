<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clouds.html</title>
<style>

* {
  margin:0px;
  padding:0px;
  color:white;
  }

body {
  background: rgb(0,0,0);
  background: linear-gradient(180deg, rgba(0,0,0,1) 21%, rgba(255,255,255,1) 100%);
  overflow:hidden;
  width:100vw;
  height:100vh;
  }
  
.forest {
  background-image:url("src/clouds/forest.png");
  position:absolute;
  background-position:bottom;
  width:100vw;
  height:100vh;
  background-repeat:repeat-x;
  }

.moon {
  background-image:url("src/clouds/moon.svg");
  background-repeat:none;
  background-size: contain;
  position:absolute;
  width:500px;
  height:500px;
  right:5%;
  top:1%;
  opacity:1;
  }
  

.vignette {
  background: rgb(0,0,0);
  background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,1) 90%);
  position:absolute;
  width:100vw;
  height:100vh;
  }

/*
  Cloud layers — single source of truth via --tile.

  Each layer sets one custom property, --tile, equal to its own
  background-size. Everything else (box width, background-size, and how
  far the keyframe travels) reads from that one variable via calc()/var().
  That makes the old bug class structurally impossible: you can no longer
  change the tile size in one place and forget it in another, because
  there's only one place.

  How the loop stays seamless: the box is (100vw + tile) wide, so it always
  has one full tile of buffer to slide through. It animates from
  translateX(-tile) to translateX(0) — i.e. it drifts in the POSITIVE x
  direction (rightward), matching the original background-position-x
  animation's direction. Because the travel distance exactly equals the
  tile width, the pattern at the end of the loop is pixel-identical to the
  pattern at the start, so the reset is invisible.

  transform (not background-position) is used because it's
  compositor/GPU-only — no repaint per frame — which is what actually
  makes the motion look smooth rather than stepped.

  To change speed: edit --duration on the relevant class. Lower = faster.
  To reverse direction: swap the two keyframe values, or add
  `animation-direction: reverse;` to a layer.
*/
.clouds {
  position:absolute;
  top:0;
  left:0;
  height:100vh;
  width:calc(100vw + var(--tile));
  background-repeat:repeat-x;
  background-position-y:65%;
  background-size:var(--tile);
  will-change:transform;
  backface-visibility:hidden;
  animation: drift var(--duration) linear infinite;
  }

.C1 { --tile:1024px; --duration:180s; background-image:url("src/clouds/C1.png"); }
.C2 { --tile:1024px; --duration:140s; background-image:url("src/clouds/C2.png"); }
.C3 { --tile:1024px; --duration:100s; background-image:url("src/clouds/C3.png"); }
.C4 { --tile:1024px; --duration:70s;  background-image:url("src/clouds/C4.png"); }
.C5 { --tile:1400px; --duration:50s;  background-image:url("src/clouds/C5.png"); }
.C6 { --tile:1400px; --duration:30s;  background-image:url("src/clouds/C6.png"); }

@keyframes drift {
  from {
    transform: translate3d(calc(-1 * var(--tile)), 0, 0);
  }
  to {
    transform: translate3d(0, 0, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .clouds {
    animation: none;
  }
}

.buttonBox {
  position:absolute;
  z-index:98;
  left:50%;
  transform:translate(-49%);
  bottom:20px;
  }
  
.buttonBox a {
  color:white;
  text-decoration:none;
  display:block;
  float:left;
  padding-right:10px;
  padding-left:10px;
  font-style:italic;
  letter-spacing:3px;
  text-shadow: 1px 1px 6px rgba(0,0,0,0.2);
  transition:letter-spacing 0.2s ease-in-out;
  line-height:40px;
  font-size:10px;
  }
  
.buttonBox a:hover {
  text-decoration:underline;
  letter-spacing:5px;
  }
  
</style>
  </head>
  <body>
<div class="clouds C1"></div>
<div class="clouds C2"></div>
<div class="clouds C3"></div>
<div class="clouds C4"></div>
<div class="clouds C5"></div>
<div class="clouds C6"></div>
<div class="vignette"></div>
<div class="moon"></div>
<div class="forest"></div>
<div class="buttonBox">
    </div>
  </body>
</html>
