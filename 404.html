    <style>
        /* No nav on this page — remove its reserved space */
        main { padding-top: 0; }
        .hero { min-height: 100vh; }

        /* Subtle animated scanlines over the hero */
        .nf-scanlines {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .05;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(216, 31, 47, .4) 3px,
                rgba(216, 31, 47, .4) 4px
            );
            animation: nfScanFlicker 6s infinite steps(1);
        }
        @keyframes nfScanFlicker {
            0%, 96%, 100% { opacity: .05; }
            97%, 99%      { opacity: .13; }
        }

        @media (prefers-reduced-motion: reduce) {
            .nf-scanlines { animation: none; opacity: .04; }
        }
    </style>
</head>
<body>

    <canvas id="three-canvas"></canvas>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div id="cursor-glow"></div>
    <div class="ripple-container" id="ripple-container"></div>

    <main>
        <section class="hero" id="hero">
            <div class="nf-scanlines"></div>
            <div class="hero-kicker">.Lost. .Deleted. .Never Filed.</div>
            <div class="hero-title-wrap">
                <h1 class="hero-title" data-text="404">404</h1>
            </div>
            <p class="hero-subtitle" id="nf-subtitle"><span class="cursor-blink"></span></p>
        </section>
    </main>

    <script src="js/interactions.js"></script>
    <script src="js/script.js"></script>

    <script>
    // The preloader is removed on this page, so interactions.js dispatches
    // 'siteReady' synchronously — before its own heroEntrance() listener is
    // attached. We run the entrance ourselves instead of waiting for the event.
    (function () {
        const titleEl = document.querySelector('.hero-title');
        const kicker = document.querySelector('.hero-kicker');
        const subtitle = document.getElementById('nf-subtitle');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function revealAll() {
            [kicker, subtitle].forEach(el => {
                if (el) { el.style.opacity = '1'; el.style.transform = 'none'; }
            });
            if (titleEl) {
                titleEl.querySelectorAll('.char').forEach(c => {
                    c.style.opacity = '1';
                    c.style.transform = 'none';
                });
                titleEl.style.setProperty('--after-reveal', '1');
            }
            window.__heroDone = true;
            document.dispatchEvent(new Event('heroDone'));
        }

        if (reduced || !window.gsap) {
            revealAll();
            return;
        }

        // Wait one frame so interactions.js finishes splitting .hero-title
        // into individual .char spans before we animate them.
        requestAnimationFrame(() => {
            const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
            if (kicker) tl.to(kicker, { opacity: 1, y: 0, duration: 1.0 }, 0.05);
            if (titleEl) {
                tl.to(titleEl.querySelectorAll('.char'), { opacity: 1, y: 0, rotate: 0, duration: 1.35, stagger: 0.052 }, 0.2)
                  .to(titleEl, { onStart: () => titleEl.style.setProperty('--after-reveal', '1'), duration: 0.1 }, '-=0.7');
            }
            if (subtitle) tl.to(subtitle, { opacity: 1, y: 0, duration: 0.9 }, '-=0.6');
            tl.call(() => {
                window.__heroDone = true;
                document.dispatchEvent(new Event('heroDone'));
            });
        });
    })();

    // Subtitle typewriter — starts once the entrance finishes.
    (function () {
        const el = document.getElementById('nf-subtitle');
        if (!el) return;
        const full = "The page you followed isn't in this archive. Wrong turn, dead link, or it was never filed at all.";

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            el.textContent = full;
            return;
        }

        let idx = 0;
        let html = '';
        function type() {
            if (idx < full.length) {
                html += full[idx];
                idx++;
                el.innerHTML = html + ' <span class="cursor-blink"></span>';
                setTimeout(type, 22);
            } else {
                const cursor = el.querySelector('.cursor-blink');
                if (cursor) cursor.classList.add('hidden');
            }
        }
        if (window.__heroDone) setTimeout(type, 200);
        else document.addEventListener('heroDone', () => setTimeout(type, 200), { once: true });
    })();
    </script>

</body>
