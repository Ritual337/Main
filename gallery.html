<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Ritual</title>
<meta name="robots" content="index, follow" />
<meta name="theme-color" content="#0a0908" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230a0908%22/><text x=%2250%22 y=%2270%22 font-family=%22Georgia, serif%22 font-size=%2262%22 fill=%22%23d81f2f%22 text-anchor=%22middle%22>R</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0a0908; --bg2:#121110; --bg3:#17140f; --paper:#f1ead9; --paper-dim:#cbc2ad; --ink:#8d8578;
    --red:#d81f2f; --red-bright:#ff3346; --red-glow:rgba(216,31,47,.28); --red-glow-strong:rgba(255,51,70,.5);
    --line:#241f1a; --line-bright:#3a3229;
    --mono:'IBM Plex Mono',monospace; --serif:'Source Serif 4',Georgia,serif; --display:'Bebas Neue','IBM Plex Mono',sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --dur-fast: 160ms; --dur-base: 260ms; --dur-slow: 480ms;
    --nav-h:4.5rem;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color: var(--line-bright) transparent;}
  body{ background:var(--bg); color:var(--paper-dim); font-family:var(--serif); min-height:100vh; -webkit-font-smoothing:antialiased; cursor: crosshair; }
  body.overlay-open{ overflow:hidden; }
  img{ max-width:100%; display:block; }
  button { font: inherit; }
  :focus-visible{ outline:2px solid var(--red-bright); outline-offset:3px; border-radius:1px; }

  .vignette{ position:fixed; inset:0; pointer-events:none; z-index:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.78) 100%); }

  /* ===== nav ===== */
  .nav-bar{
    position: fixed; top: 0; left: 0; right: 0; height:var(--nav-h); z-index:500; background:rgba(10,9,8,.78);
    backdrop-filter:blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-bottom:1px solid var(--line); transition: background var(--dur-slow) var(--ease-out), border-color var(--dur-slow) var(--ease-out);
  }
  .nav-bar.scrolled { background: rgba(10,9,8,.94); border-bottom-color: var(--line-bright); }
  .nav-inner{ max-width:1400px; height:100%; margin:0 auto; padding:0 2rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .nav-logo{ display:flex; align-items:center; gap:.6rem; text-decoration:none; }
  .nav-logo-mark{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:var(--red); color:var(--bg); font-family:var(--display); font-size:1.1rem; border-radius:3px; box-shadow:0 0 14px var(--red-glow-strong); transition: transform var(--dur-base) var(--ease-out); }
  .nav-logo:hover .nav-logo-mark { transform: rotate(-8deg) scale(1.08); }
  .nav-logo-text{ font-family:var(--display); font-size:1.1rem; letter-spacing:.1em; color:var(--paper); text-transform:uppercase; }
  .nav-logo-text em{ color:var(--red-bright); font-style:normal; }
  .nav-status{ font-family:var(--mono); font-size:.6rem; color:var(--ink); letter-spacing:.1em; text-transform:uppercase; }

  main.section{ position:relative; z-index:1; padding: calc(var(--nav-h) + 3rem) 2rem 6rem; max-width:1400px; margin:0 auto; }
  .eyebrow{ display:flex; align-items:center; gap:1rem; margin-bottom:1.4rem; flex-wrap:wrap; }
  .eyebrow-num{ font-family:var(--mono); font-size:.62rem; letter-spacing:.18em; color:var(--bg); background:var(--red); padding:.25rem .5rem; border-radius:2px; }
  .eyebrow-text{ font-family:var(--mono); font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; color:var(--paper); }
  .eyebrow-line{ flex:1; height:1px; background:var(--line-bright); }
  .eyebrow-meta{ font-family:var(--mono); font-size:.52rem; color:var(--ink-dim); letter-spacing:.04em; white-space:nowrap; }

  .section-title{ font-family:var(--display); font-size:clamp(2.4rem,6vw,4.2rem); letter-spacing:.02em; color:var(--paper); text-transform:uppercase; line-height:.9; }
  .section-note{ font-family:var(--mono); font-style:normal; font-size:.68rem; color:var(--ink); letter-spacing:.03em; margin:1rem 0 1.5rem; max-width:56ch; line-height:1.8; }

  /* search */
  .search-area{ display:flex; gap:.8rem; margin-bottom:2rem; flex-wrap:wrap; align-items:center; }
  .search-area input{
    flex:1; min-width:200px; background:var(--bg2); border:1px solid var(--line-bright); color:var(--paper);
    font-family:var(--mono); font-size:.7rem; padding:.6rem .8rem; transition:border-color var(--dur-base); border-radius: 2px;
  }
  .search-area input:focus{ outline:none; border-color:var(--red-bright); }
  .search-area input::placeholder{ color:var(--ink-dim); }
  .search-clear{
    background:none; border:1px solid var(--line-bright); color:var(--ink); font-family:var(--mono);
    font-size:.55rem; letter-spacing: .08em; text-transform: uppercase; padding:.6rem .9rem; cursor:pointer; transition:border-color var(--dur-base),color var(--dur-base); border-radius: 2px;
  }
  .search-clear:hover{ border-color:var(--red-bright); color:var(--red-bright); }

  .gallery-state{ font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); text-align:center; padding:4rem 0; }

  /* loading skeleton */
  .gallery-grid.skeleton .gallery-card .skeleton-img{
    width:100%; height:280px; background:linear-gradient(90deg, var(--bg2) 25%, var(--line) 50%, var(--bg2) 75%);
    background-size:200% 100%; animation:skeleton-loading 1.5s infinite;
  }
  @keyframes skeleton-loading{ 0%{background-position:200% 0;}100%{background-position:-200% 0;} }

  .gallery-grid{ background: var(--line); border: 1px solid var(--line); transition: opacity .3s; }
  .gallery-grid.fade{ opacity:0; }

  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .gallery-card { animation: cardIn .5s var(--ease-out) backwards; }
  @media (prefers-reduced-motion: reduce) { .gallery-card { animation: none; } }

  /* layout modes — same contact-sheet hover language as the main site's Frames grid */
  .gallery-grid.layout-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; }
  .gallery-grid.layout-grid .gallery-card { display:block; width:100%; aspect-ratio: 1/1; position:relative; background:var(--bg2); border:none; padding:0; cursor:zoom-in; overflow: hidden; }
  .gallery-grid.layout-grid .gallery-card img { width:100%; height:100%; object-fit:cover; filter:grayscale(80%) brightness(.5); transition:filter .45s ease, transform .5s var(--ease-out); }
  .gallery-grid.layout-grid .gallery-card:hover img { filter:grayscale(8%) brightness(.92); transform:scale(1.05); }

  .gallery-grid.layout-masonry { column-count:5; column-gap:1px; }
  .gallery-grid.layout-masonry .gallery-card { display:block; width:100%; break-inside:avoid; margin-bottom:1px; position:relative; background:var(--bg2); border:none; padding:0; cursor:zoom-in; overflow: hidden; }
  .gallery-grid.layout-masonry .gallery-card img { width:100%; height:auto; filter:grayscale(80%) brightness(.5); transition:filter .45s ease, transform .5s var(--ease-out); }
  .gallery-grid.layout-masonry .gallery-card:hover img { filter:grayscale(8%) brightness(.92); transform:scale(1.05); }

  .gallery-grid.layout-fixed { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; }
  .gallery-grid.layout-fixed .gallery-card { display:block; width:100%; position:relative; background:var(--bg2); border:none; padding:0; cursor:zoom-in; overflow: hidden; }
  .gallery-grid.layout-fixed .gallery-card img { width:100%; height:280px; object-fit:cover; filter:grayscale(80%) brightness(.5); transition:filter .45s ease, transform .5s var(--ease-out); }
  .gallery-grid.layout-fixed .gallery-card:hover img { filter:grayscale(8%) brightness(.92); transform:scale(1.05); }

  .gallery-num { position:absolute; top:.6rem; left:.6rem; font-family:var(--mono); font-size:.5rem; color:var(--red-bright); letter-spacing:.1em; z-index:2; text-shadow: 0 1px 6px rgba(0,0,0,.95); }
  .gallery-cap {
    position:absolute; left:0; right:0; bottom:0; z-index: 1; padding:.8rem .85rem; font-family:var(--mono); font-size:.55rem; letter-spacing:.04em; color:var(--paper);
    background:linear-gradient(to top, rgba(6,5,5,.9) 0%, rgba(6,5,5,.3) 48%, transparent 78%); opacity:0; transition:opacity var(--dur-base) ease;
  }
  .gallery-card:hover .gallery-cap { opacity:1; }

  @media (max-width:1100px){ .gallery-grid.layout-grid,.gallery-grid.layout-fixed { grid-template-columns:repeat(4,1fr); } .gallery-grid.layout-masonry { column-count:4; } }
  @media (max-width:760px){ .gallery-grid.layout-grid,.gallery-grid.layout-fixed { grid-template-columns:repeat(3,1fr); } .gallery-grid.layout-masonry { column-count:3; }
    .gallery-cap { opacity: 1; background: linear-gradient(to top, rgba(6,5,5,.85) 0%, transparent 65%); } }
  @media (max-width:480px){ .gallery-grid.layout-grid,.gallery-grid.layout-fixed { grid-template-columns:repeat(2,1fr); } .gallery-grid.layout-masonry { column-count:2; } }

  /* lightbox with share — corner brackets to match the site's case-file lightbox */
  .lightbox{ position:fixed; inset:0; z-index:9000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .35s var(--ease-out); padding:2rem; }
  .lightbox.active{ opacity:1; pointer-events:all; }
  .lightbox-backdrop{ position:absolute; inset:0; background:rgba(6,5,4,.96); backdrop-filter:blur(14px); cursor:pointer; }
  .lightbox-frame{ position:relative; max-width:min(92vw,1200px); max-height:88vh; z-index:2; transform: scale(.96); transition: transform .35s var(--ease-out); }
  .lightbox.active .lightbox-frame { transform: scale(1); }
  .lightbox-frame::before, .lightbox-frame::after, .lightbox-corner-a, .lightbox-corner-b {
    content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--red-bright); opacity: .75; pointer-events: none;
  }
  .lightbox-frame::before { top: -10px; left: -10px; border-right: none; border-bottom: none; }
  .lightbox-frame::after { top: -10px; right: -10px; border-left: none; border-bottom: none; }
  .lightbox-corner-a { bottom: -10px; left: -10px; border-right: none; border-top: none; }
  .lightbox-corner-b { bottom: -10px; right: -10px; border-left: none; border-top: none; }
  .lightbox-img{ max-width:100%; max-height:76vh; object-fit:contain; box-shadow:0 30px 80px rgba(0,0,0,.7); border:1px solid var(--line-bright); background: var(--bg2); }
  .lightbox-caption{ margin-top:1rem; text-align:center; font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; color:var(--ink); }
  .lightbox-actions{ display:flex; justify-content:center; gap:.6rem; margin-top:.6rem; flex-wrap:wrap; }
  .lightbox-actions button{
    background:rgba(10,9,8,.85); border:1px solid var(--line-bright); color:var(--paper); font-family:var(--mono);
    font-size:.5rem; letter-spacing:.08em; padding:.4rem .7rem; cursor:pointer; text-transform:uppercase;
    transition:border-color var(--dur-fast),color var(--dur-fast); display:inline-flex; align-items:center; gap:.4rem; border-radius: 2px;
  }
  .lightbox-actions button:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .lightbox-close, .lightbox-nav{
    position:absolute; background:rgba(10,9,8,.85); border:1px solid var(--line-bright); color:var(--paper);
    font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; padding:.5rem .8rem; cursor:pointer; text-transform:uppercase;
    transition:border-color var(--dur-fast),color var(--dur-fast); display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  }
  .lightbox-close:hover, .lightbox-nav:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .lightbox-close{ top:-2.6rem; right:0; border-radius: 2px; }
  .lightbox-nav{ top:50%; transform:translateY(-50%); font-size:1rem; padding:.7rem .9rem; border-radius: 50%; }
  .lightbox-prev{ left:-3.4rem; } .lightbox-next{ right:-3.4rem; }
  @media (max-width:860px){
    .lightbox-prev{ left:.4rem; } .lightbox-next{ right:.4rem; }
    .lightbox-close{ top:.4rem; right:.4rem; }
    .lightbox-actions button{ font-size:.45rem; padding:.3rem .6rem; }
  }

  /* pagination */
  .pagination{ display:flex; justify-content:center; gap:.4rem; margin-top:2rem; flex-wrap:wrap; }
  .pagination button{
    background:var(--bg2); border:1px solid var(--line); color:var(--ink); font-family:var(--mono);
    font-size:.55rem; padding:.5rem .85rem; cursor:pointer; transition:border-color var(--dur-base),color var(--dur-base); border-radius: 2px;
  }
  .pagination button:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .pagination button.active{ border-color:var(--red-bright); color:var(--red-bright); background:var(--red-glow); }
  .pagination button:disabled{ opacity:.3; cursor:not-allowed; }

  /* toast (fallback defined inline in gallery.js also creates this, kept for initial paint) */
  #toast-stack { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: .5rem; pointer-events: none; max-width: 90vw; }
</style>
</head>
<body>
<div class="vignette"></div>

<nav class="nav-bar" id="nav-bar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-mark">R</span><span class="nav-logo-text">Ritu<em>al</em></span>
    </a>
    <div class="nav-status">Public Gallery</div>
  </div>
</nav>

<main class="section">
  <div class="eyebrow">
    <span class="eyebrow-num">07</span>
    <span class="eyebrow-text">Gallery</span>
    <span class="eyebrow-line"></span>
    <span class="eyebrow-meta" id="gallery-meta"></span>
  </div>
  <h1 class="section-title">Full Archive</h1>
  <p class="section-note">The complete set, unlisted and unindexed. Tap any frame to open it full-size.</p>

  <!-- Search -->
  <div class="search-area">
    <input type="text" id="search-input" placeholder="Search by caption..." />
    <button class="search-clear" id="search-clear">Clear</button>
  </div>

  <p class="gallery-state" id="gallery-state" hidden></p>
  <div class="gallery-grid skeleton" id="gallery-grid" hidden></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
  <div class="lightbox-frame">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close"><i class="fas fa-xmark"></i> Close</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="lightbox-actions">
      <button id="lightbox-share" data-share><i class="fas fa-link"></i> Copy Link</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const nav = document.getElementById('nav-bar');
    if (!nav) return;
    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 40), { passive: true });
  })();
</script>
<script src="js/toast.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
