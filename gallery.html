<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Ritual</title>
<meta name="robots" content="index, follow" />
<meta name="theme-color" content="#0b0a09" />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0b0a09; --bg2:#121110; --paper:#efe8d9; --paper-dim:#c9c0ac; --ink:#8c8478;
    --red:#d81f2f; --red-bright:#ff3346; --red-glow:rgba(216,31,47,.30); --line:#2a2521; --line-bright:#3c352d;
    --mono:'IBM Plex Mono',monospace; --serif:'Source Serif 4',Georgia,serif; --display:'Bebas Neue','IBM Plex Mono',sans-serif;
    --nav-h:4.5rem;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg); color:var(--paper-dim); font-family:var(--serif); min-height:100vh; }
  body.overlay-open{ overflow:hidden; }
  img{ max-width:100%; display:block; }

  .nav-bar{
    position:sticky; top:0; z-index:500; height:var(--nav-h); background:rgba(11,10,9,.92);
    backdrop-filter:blur(16px); border-bottom:1px solid var(--line);
  }
  .nav-inner{ max-width:1400px; height:100%; margin:0 auto; padding:0 2rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .nav-logo{ display:flex; align-items:center; gap:.6rem; text-decoration:none; }
  .nav-logo-mark{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:var(--red); color:var(--bg); font-family:var(--display); font-size:1.1rem; border-radius:2px; }
  .nav-logo-text{ font-family:var(--display); font-size:1.1rem; letter-spacing:.1em; color:var(--paper); text-transform:uppercase; }
  .nav-logo-text em{ color:var(--red-bright); font-style:normal; }
  .nav-status{ font-family:var(--mono); font-size:.6rem; color:var(--ink); letter-spacing:.1em; text-transform:uppercase; }

  .section{ padding:4rem 2rem 6rem; max-width:1400px; margin:0 auto; }
  .eyebrow{ display:flex; align-items:center; gap:1rem; margin-bottom:1.4rem; flex-wrap:wrap; }
  .eyebrow-num{ font-family:var(--mono); font-size:.62rem; letter-spacing:.18em; color:var(--bg); background:var(--red); padding:.25rem .5rem; border-radius:2px; }
  .eyebrow-text{ font-family:var(--mono); font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; color:var(--paper); }
  .eyebrow-line{ flex:1; height:1px; background:var(--line-bright); }
  .eyebrow-meta{ font-family:var(--mono); font-size:.52rem; color:var(--ink-dim); letter-spacing:.04em; white-space:nowrap; }

  .section-title{ font-family:var(--display); font-size:clamp(2.4rem,6vw,4.2rem); letter-spacing:.02em; color:var(--paper); text-transform:uppercase; line-height:.9; }
  .section-note{ font-family:var(--mono); font-style:normal; font-size:.68rem; color:var(--ink); letter-spacing:.03em; margin:1rem 0 1.5rem; max-width:56ch; line-height:1.8; }

  /* search */
  .search-area{ display:flex; gap:.8rem; margin-bottom:2rem; flex-wrap:wrap; align-items:center; }
  .search-area input{
    flex:1; min-width:200px; background:var(--bg); border:1px solid var(--line-bright); color:var(--paper);
    font-family:var(--mono); font-size:.7rem; padding:.5rem .7rem; transition:border-color .2s;
  }
  .search-area input:focus{ outline:none; border-color:var(--red-bright); }
  .search-area input::placeholder{ color:var(--ink-dim); }
  .search-clear{
    background:none; border:1px solid var(--line-bright); color:var(--ink); font-family:var(--mono);
    font-size:.55rem; padding:.4rem .8rem; cursor:pointer; transition:border-color .2s,color .2s;
  }
  .search-clear:hover{ border-color:var(--red-bright); color:var(--red-bright); }

  .gallery-state{ font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); text-align:center; padding:4rem 0; }

  /* loading skeleton */
  .gallery-grid.skeleton .gallery-card .skeleton-img{
    width:100%; height:280px; background:linear-gradient(90deg, var(--bg2) 25%, var(--line) 50%, var(--bg2) 75%);
    background-size:200% 100%; animation:skeleton-loading 1.5s infinite;
  }
  @keyframes skeleton-loading{ 0%{background-position:200% 0;}100%{background-position:-200% 0;} }

  .gallery-grid{
    background: var(--line);
    transition: opacity .3s;
  }
  .gallery-grid.fade{ opacity:0; }

  /* layout modes - same as before with minor additions */
  .gallery-grid.layout-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; }
  .gallery-grid.layout-grid .gallery-card { display:block; width:100%; position:relative; background:var(--bg2); border:none; padding:0; cursor:zoom-in; }
  .gallery-grid.layout-grid .gallery-card img { width:100%; height:100%; object-fit:cover; filter:grayscale(78%) brightness(.55); transition:filter .4s ease, transform .5s ease; }
  .gallery-grid.layout-grid .gallery-card:hover img { filter:grayscale(10%) brightness(.92); transform:scale(1.02); }

  .gallery-grid.layout-masonry { column-count:4; column-gap:1px; }
  .gallery-grid.layout-masonry .gallery-card { display:block; width:100%; break-inside:avoid; margin-bottom:1px; position:relative; background:var(--bg2); border:none; padding:0; cursor:zoom-in; }
  .gallery-grid.layout-masonry .gallery-card img { width:100%; height:auto; filter:grayscale(78%) brightness(.55); transition:filter .4s ease, transform .5s ease; }
  .gallery-grid.layout-masonry .gallery-card:hover img { filter:grayscale(10%) brightness(.92); transform:scale(1.02); }

  .gallery-grid.layout-fixed { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; }
  .gallery-grid.layout-fixed .gallery-card { display:block; width:100%; position:relative; background:var(--bg2); border:none; padding:0; cursor:zoom-in; }
  .gallery-grid.layout-fixed .gallery-card img { width:100%; height:280px; object-fit:cover; filter:grayscale(78%) brightness(.55); transition:filter .4s ease, transform .5s ease; }
  .gallery-grid.layout-fixed .gallery-card:hover img { filter:grayscale(10%) brightness(.92); transform:scale(1.02); }

  .gallery-num { position:absolute; top:.6rem; left:.6rem; font-family:var(--mono); font-size:.55rem; color:var(--red-bright); background:rgba(0,0,0,.6); padding:.15rem .4rem; letter-spacing:.1em; z-index:2; }
  .gallery-cap { position:absolute; left:0; right:0; bottom:0; padding:.7rem .8rem; font-family:var(--mono); font-size:.56rem; letter-spacing:.04em; color:var(--paper); background:linear-gradient(transparent, rgba(0,0,0,.85)); opacity:0; transition:opacity .3s; pointer-events:none; }
  .gallery-card:hover .gallery-cap { opacity:1; }

  @media (max-width:1100px){ .gallery-grid.layout-grid,.gallery-grid.layout-fixed { grid-template-columns:repeat(3,1fr); } .gallery-grid.layout-masonry { column-count:3; } }
  @media (max-width:760px){ .gallery-grid.layout-grid,.gallery-grid.layout-fixed { grid-template-columns:repeat(2,1fr); } .gallery-grid.layout-masonry { column-count:2; } }
  @media (max-width:480px){ .gallery-grid.layout-grid,.gallery-grid.layout-fixed { grid-template-columns:1fr; } .gallery-grid.layout-masonry { column-count:1; } }

  /* lightbox with share */
  .lightbox{ position:fixed; inset:0; z-index:9000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .35s ease; padding:2rem; }
  .lightbox.active{ opacity:1; pointer-events:all; }
  .lightbox-backdrop{ position:absolute; inset:0; background:rgba(6,5,4,.94); backdrop-filter:blur(6px); cursor:pointer; }
  .lightbox-frame{ position:relative; max-width:min(92vw,1200px); max-height:88vh; z-index:2; }
  .lightbox-img{ max-width:100%; max-height:80vh; object-fit:contain; box-shadow:0 30px 80px rgba(0,0,0,.7); border:1px solid var(--line-bright); }
  .lightbox-caption{ margin-top:1rem; text-align:center; font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; color:var(--ink); }
  .lightbox-actions{ display:flex; justify-content:center; gap:.6rem; margin-top:.6rem; flex-wrap:wrap; }
  .lightbox-actions button{
    background:rgba(11,10,9,.85); border:1px solid var(--line-bright); color:var(--paper); font-family:var(--mono);
    font-size:.5rem; letter-spacing:.08em; padding:.4rem .7rem; cursor:pointer; text-transform:uppercase;
    transition:border-color .2s,color .2s;
  }
  .lightbox-actions button:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .lightbox-close, .lightbox-nav{
    position:absolute; background:rgba(11,10,9,.85); border:1px solid var(--line-bright); color:var(--paper);
    font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; padding:.5rem .8rem; cursor:pointer; text-transform:uppercase;
    transition:border-color .2s,color .2s;
  }
  .lightbox-close:hover, .lightbox-nav:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .lightbox-close{ top:-2.6rem; right:0; }
  .lightbox-nav{ top:50%; transform:translateY(-50%); font-size:1rem; padding:.7rem .9rem; }
  .lightbox-prev{ left:-3.4rem; } .lightbox-next{ right:-3.4rem; }
  @media (max-width:860px){
    .lightbox-prev{ left:.4rem; } .lightbox-next{ right:.4rem; }
    .lightbox-close{ top:.4rem; right:.4rem; }
    .lightbox-actions button{ font-size:.45rem; padding:.3rem .6rem; }
  }

  /* pagination */
  .pagination{ display:flex; justify-content:center; gap:.4rem; margin-top:2rem; flex-wrap:wrap; }
  .pagination button{
    background:var(--bg2); border:1px solid var(--line); color:var(--ink); font-family:var(--mono);
    font-size:.55rem; padding:.4rem .8rem; cursor:pointer; transition:border-color .2s,color .2s;
  }
  .pagination button:hover{ border-color:var(--red-bright); color:var(--red-bright); }
  .pagination button.active{ border-color:var(--red-bright); color:var(--red-bright); background:var(--red-glow); }
  .pagination button:disabled{ opacity:.3; cursor:not-allowed; }
</style>
</head>
<body>

<nav class="nav-bar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="nav-logo-mark">R</span><span class="nav-logo-text">Ritu<em>al</em></span>
    </a>
    <div class="nav-status">Public Gallery</div>
  </div>
</nav>

<main class="section">
  <div class="eyebrow">
    <span class="eyebrow-num">07</span>
    <span class="eyebrow-text">Gallery</span>
    <span class="eyebrow-line"></span>
    <span class="eyebrow-meta" id="gallery-meta"></span>
  </div>
  <h1 class="section-title">Full Archive</h1>
  <p class="section-note">The complete set, unlisted and unindexed. Tap any frame to open it full-size.</p>

  <!-- Search -->
  <div class="search-area">
    <input type="text" id="search-input" placeholder="Search by caption..." />
    <button class="search-clear" id="search-clear">Clear</button>
  </div>

  <p class="gallery-state" id="gallery-state" hidden></p>
  <div class="gallery-grid skeleton" id="gallery-grid" hidden></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
  <div class="lightbox-frame">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕ Close</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">←</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">→</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="lightbox-actions">
      <button id="lightbox-share" data-share>Copy Link</button>
    </div>
  </div>
</div>

<script src="js/toast.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
